<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weighted Character Lift & Toss</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Animation study / 02</p>
        <h1>Weighted Character <span>Lift &amp; Toss</span></h1>
      </div>
      <div class="project-mark" aria-label="Animation duration">08.0s <span>loop</span></div>
    </header>

    <section class="stage-wrap" aria-label="Animation preview">
      <canvas id="stage" width="1280" height="720"></canvas>
      <div class="stage-overlay">
        <div class="pose-readout"><span id="poseDot"></span><strong id="poseName">Anticipation</strong><span id="poseTime">00:00</span></div>
        <div class="frame-readout" id="frameReadout">FRAME 000</div>
      </div>
    </section>

    <section class="control-panel">
      <div class="controls-row">
        <button class="icon-button" id="playButton" type="button" aria-label="Play animation"><span id="playIcon">▶</span></button>
        <button class="text-button" id="restartButton" type="button">Restart</button>
        <div class="scrubber-group">
          <input id="timeline" type="range" min="0" max="8" step="0.01" value="0" aria-label="Animation timeline">
          <div class="time-labels"><span>00:00</span><span>00:08</span></div>
        </div>
        <button class="export-button" id="recordButton" type="button"><span>●</span> Record proof</button>
        <button class="text-button" id="pngButton" type="button">Save frame</button>
      </div>
      <div class="beats" role="list" aria-label="Animation beats">
        <button class="beat active" data-time="0.55" type="button" role="listitem"><b>01</b><span>Anticipation</span><small>0:00–0:01.5</small></button>
        <button class="beat" data-time="2.5" type="button" role="listitem"><b>02</b><span>Exertion</span><small>0:01.5–0:04</small></button>
        <button class="beat" data-time="4.35" type="button" role="listitem"><b>03</b><span>Release</span><small>0:04–0:05</small></button>
        <button class="beat" data-time="6.25" type="button" role="listitem"><b>04</b><span>Recovery</span><small>0:05–0:08</small></button>
      </div>
    </section>

    <footer class="footer-note"><span class="status-dot"></span><span id="statusText">Ready to animate</span><span class="footer-rule"></span><span>Weighted motion study · 24 fps</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
